name: Build Check and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "26.1"
    tags:
      - "!*"
  pull_request:
    branches:
      - "26.1"

permissions:
  contents: read
  packages: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - run: chmod +x ./gradlew
      - run: ./gradlew assemble --scan
      - run: ./gradlew data checkReleaseVersion --no-parallel

  platforms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: common
          - platform: forge
            data: runGenDataData
            gameTest: runRunGameGameTestServer
          - platform: fabric
            data: runData
            gameTest: runGameTestServer
          - platform: neoforge
            data: runClientData
            gameTest: runGameTestServer
    env:
      DISABLE_FORGE: ${{ matrix.platform != 'forge' }}
      DISABLE_FABRIC: ${{ matrix.platform != 'fabric' }}
      DISABLE_NEOFORGE: ${{ matrix.platform != 'neoforge' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          add-job-summary: 'never'
          cache-read-only: 'false'
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - run: ls -al && whoami
      - name: Compile main ${{ matrix.platform }}
        run: ./gradlew :${{ matrix.platform }}:classes
      - name: Compile test ${{ matrix.platform }}
        run: ./gradlew :${{ matrix.platform }}:testClasses
      - name: JUnit ${{ matrix.platform }}
        run: ./gradlew :${{ matrix.platform }}:test
        env:
          TEST_UTILITY_LOG_ALL_TEST: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
      - name: Data ${{ matrix.platform }}
        if: matrix.platform != 'common'
        run: ./gradlew :${{ matrix.platform }}:${{ matrix.data }}
        env:
          TEST_UTILITY_LOG_ALL_DATA: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
          RUN_DATA: true
      - name: 'Data common(in NeoForge module)'
        if: matrix.platform == 'neoforge'
        run: ./gradlew :${{ matrix.platform }}:runCommonData
        env:
          TEST_UTILITY_LOG_ALL_DATA: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
          RUN_DATA: true
      - name: 'Data gameTest(in Forge module)'
        if: matrix.platform == 'forge'
        run: ./gradlew :${{ matrix.platform }}:runRunGameData
        env:
          TEST_UTILITY_LOG_ALL_DATA: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
          RUN_DATA: true
      - name: Check updated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes or untracked files detected!"
            git status
            exit 1
          fi
      - name: GameTest ${{ matrix.platform }}
        if: matrix.platform != 'common'
        run: ./gradlew :${{ matrix.platform }}:${{ matrix.gameTest }}
        env:
          TEST_UTILITY_LOG_ALL_TEST: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
          RUN_GAME_TEST: true
      - name: Check report
        run: |
          ! test -d "${{ matrix.platform }}/game-test/crash-reports"
      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: |
            ${{ matrix.platform }}/build/reports/tests/*
            ${{ matrix.platform }}/game-test/crash-reports/*
          name: Test-Report-${{ github.run_number }}-QuarryPlus-${{ matrix.platform }}

  merge-checker:
    if: always()
    needs:
      - assemble
      - platforms
    uses: 'Kotori316/common-script/.github/workflows/merge-checker.yaml@cc63e8610e21a91ed102150d078b10d216e02b76' # v2.0.3
    with:
      needs: ${{ toJSON(needs) }}
