name: Build Check and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "1.19.2"
    tags:
      - "!*"
    paths:
      - "src/main/**"
      - "src/test/**"
      - "gradle.properties"
      - "build.gradle"
      - ".github/workflows/gradle.yml"
  pull_request:
    branches:
      - "1.19.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Check Warning
        run: chmod +x ./gradlew && ./gradlew javaToolchains --no-daemon --warning-mode all
      - name: Compile
        run: chmod +x ./gradlew && ./gradlew assemble --no-daemon
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
      - name: Test with JUnit
        run: chmod +x ./gradlew && ./gradlew test --no-daemon
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_OTHER_MODS_IN_RUNTIME: true
      - name: Test with runData
        run: chmod +x ./gradlew && ./gradlew runData --no-daemon
        env:
          IGNORE_OTHER_MODS_IN_RUNTIME: true
      - name: GameTest
        run: chmod +x ./gradlew && ./gradlew runGameTestServer --no-daemon
        env:
          TEST_UTILITY_LOG_ALL_TEST: true
          IGNORE_OTHER_MODS_IN_RUNTIME: true
      - name: Publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/*
          name: ${{ github.event.repository.name }}-${{ github.run_number }}
